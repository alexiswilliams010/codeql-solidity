[package]
name = "solidity-extractor"
version = "0.0.1"
edition = "2024"

[dependencies]
tree-sitter = ">= 0.23.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rayon = "1.10.0"
regex = "1.11.1"
encoding = "0.2"
lazy_static = "1.5.0"
serde_json = "1.0.140"
foundry-compilers = "0.19.10"

tree-sitter-solidity = { git = "https://github.com/alexiswilliams010/tree-sitter-solidity.git", branch = "codeql-solidity" }
codeql-extractor = { git = "https://github.com/github/codeql" }
